<style>
  /* ============================================
     VARIABLES: la paleta sale de la foto.
     Cambiá un color acá y cambia en toda la página.
     ============================================ */
  :root {
    --negro: #0c0805;        /* fondo base, casi negro con calidez */
    --fuego: #ff5a1f;        /* el naranja de las bengalas */
    --brasa: #c65a24;        /* naranja más apagado, para detalles */
    --hueso: #e9ded0;        /* blanco sucio, nunca blanco puro */
    --humo: rgba(12, 8, 5, 0.55); /* negro translúcido para oscurecer la foto */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--negro);
    color: var(--hueso);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================
     PORTADA: la foto a pantalla completa
     ============================================ */
  .portada {
    position: relative;
    height: 100svh; /* alto total de la pantalla del celu */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: hidden;
  }

  /* Degradado oscuro abajo para que el texto se lea sobre la foto */
  .portada__foto::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(12,8,5,0.55) 0%,
      rgba(12,8,5,0.15) 30%,
      rgba(12,8,5,0) 55%,
      var(--negro) 100%
    );
  }

  .portada__contenido {
    position: relative;
    z-index: 1;
    padding: 32px 20px 0;
  }

  .etiqueta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--fuego);
    margin-bottom: 6px;
  }

  .nombre {
    font-family: 'Six Caps', sans-serif;
    font-size: clamp(88px, 26vw, 150px);
    line-height: 0.86;
    letter-spacing: 0.02em;
    color: var(--hueso);
    text-shadow: 0 0 40px rgba(255, 90, 31, 0.35);
  }

  .bajada {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--hueso);
    opacity: 0.85;
    margin-top: 12px;
    max-width: 34ch;
  }

  /* Flecha que invita a bajar */
  .flecha {
    position: absolute;
    right: 20px;
    bottom: 30px;
    z-index: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    color: var(--fuego);
    animation: latido 1.8s ease-in-out infinite;
  }

  @keyframes latido {
    0%, 100% { transform: translateY(0); opacity: 1; }
    50% { transform: translateY(6px); opacity: 0.5; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flecha { animation: none; }
  }

  /* ============================================
     CUERPO: links y contenido
     ============================================ */
  .cuerpo {
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 20px 24px;
  }

  .seccion__titulo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brasa);
    margin: 36px 0 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .seccion__titulo::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(233, 222, 208, 0.15);
  }

  /* Los botones-link: bloques crudos con marco de esquinas */
  .link {
    display: block;
    position: relative;
    text-decoration: none;
    color: var(--hueso);
    border: 1px solid rgba(233, 222, 208, 0.25);
    padding: 18px 16px;
    margin-bottom: 14px;
    transition: border-color 0.2s, transform 0.15s;
  }

  /* Esquinas marcadas en naranja, como plantilla de stencil */
  .link::before, .link::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
  }
  .link::before {
    top: -1px; left: -1px;
    border-top: 2px solid var(--fuego);
    border-left: 2px solid var(--fuego);
  }
  .link::after {
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--fuego);
    border-right: 2px solid var(--fuego);
  }

  .link:hover, .link:focus-visible {
    border-color: var(--fuego);
    transform: translateX(3px);
  }

  .link:focus-visible {
    outline: 2px solid var(--fuego);
    outline-offset: 3px;
  }

  .link__nombre {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.01em;
  }

  .link__detalle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--brasa);
    margin-top: 4px;
    letter-spacing: 0.08em;
  }

  /* Video embebido de YouTube */
  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid rgba(233, 222, 208, 0.25);
  }

  .video iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Manifiesto */
  .manifiesto {
    margin-top: 44px;
    padding-top: 28px;
    border-top: 1px solid rgba(233, 222, 208, 0.15);
  }

  .manifiesto p {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    line-height: 1.65;
    opacity: 0.9;
    text-align: center;
    font-style: italic;
  }

  .manifiesto p + p { margin-top: 12px; }

  .manifiesto strong { color: var(--fuego); font-weight: 600; }

  .manifiesto .md {
    color: var(--fuego);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  .pie {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(233, 222, 208, 0.4);
    text-align: center;
    margin-top: 48px;
  }
</style>
